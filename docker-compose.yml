services:
  mysql:
    image: mysql:8
    container_name: mysql
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  productor:
    build: ./productor
    container_name: productor
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy   # no arranca hasta que MySQL este listo

  consumidor1:
    build: ./consumidor
    image: mini-proyecto-consumidor   # misma imagen para los dos consumidores
    container_name: consumidor1
    env_file: .env
    environment:
      ID_CONSUMIDOR: consumidor1
      USAR_SEMAFORO: ${USAR_SEMAFORO:-true}   # se puede cambiar al levantar (Escenario A/B)
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  consumidor2:
    build: ./consumidor
    image: mini-proyecto-consumidor
    container_name: consumidor2
    env_file: .env
    environment:
      ID_CONSUMIDOR: consumidor2
      USAR_SEMAFORO: ${USAR_SEMAFORO:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
